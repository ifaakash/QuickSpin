apiVersion: v1
kind: ConfigMap
metadata:
  name: devopshub-config
data:
  INVENTORY_FILE_NAME: "homelab.ini"
  # Directories searched for private keys, colon-separated like PATH. /secrets
  # is where the homelab-ssh-key Secret is mounted; /root/.ssh is listed too so
  # a key baked into the image or bind-mounted still appears. Missing
  # directories are skipped.
  SSH_KEY_DIRS: "/secrets:/root/.ssh"
  MYSQL_USER: "devopshub"
  MYSQL_HOST: "devopshub-db-svc"
