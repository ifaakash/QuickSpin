---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80         # The port the Service exposes internally
      targetPort: 80   # The port the Nginx container is listening on
      nodePort: 30080  # The specific port opened on the k3s node itself
