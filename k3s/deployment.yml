apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopshub-deployment
  labels:
    deployment: devopshub
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devopshub
  template:
    metadata:
      labels:
        app: devopshub
    spec:
      containers:
        - name: devopshub
          image: docker.io/library/devopshub:v1
          imagePullPolicy: Never
          ports:
           - containerPort: 8000
          envFrom:
           - configMapRef:
                name: devopshub-config
          env:
           -  name: MYSQL_PASSWORD
              valueFrom:
               secretKeyRef:
                 name: db-password
                 key: password
          # A container field, not a pod field. At pod level this is silently
          # not a VolumeMount and the Secret never reaches the container.
          volumeMounts:
            - name: ssh-key-volume
              mountPath: "/secrets"
              readOnly: true
      volumes:
        - name: ssh-key-volume
          secret:
            secretName: homelab-ssh-key
            defaultMode: 0400
