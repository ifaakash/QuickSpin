apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    app: devopshub-db
spec:
  containers:
    - name: devopshub-db
      image: mysql:8.4
      volumeMounts:
        - name: devopshub-db-volume
          mountPath: /var/lib/mysql
      env:
        - name: MYSQL_DATABASE
          value: devopshub
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: root-password
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: devopshub-config
              key: MYSQL_USER
        - name: MYSQL_HOST
          value: devopshub-db-svc
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: password
  volumes:
    - name: devopshub-db-volume
      persistentVolumeClaim:
        claimName: devopshub-db-pvc
