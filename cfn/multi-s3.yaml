AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: Dynamically create multiple S3 buckets using Fn::ForEach

Parameters:
  BucketPrefix:
    Type: String
    Default: quickspin

Resources:
  'Fn::ForEach::BucketName':
    - BucketPurpose
    - [ data, state ]
    - 'S3Bucket${BucketPurpose}':
        Type: "AWS::S3::Bucket"
        Properties:
          BucketName:  !Sub "${BucketPrefix}-cfn-lab-${BucketPurpose}-${AWS::AccountId}-${AWS::Region}"
          Tags:
            - Key: isTerraform
              Value: false
            - Key: isCFN
              Value: true
            - Key: isCD
              Value: true

Outputs:
  'Fn::ForEach::BucketOutputs':
    - BucketPurpose
    - [data, state]
    - 'BucketName${BucketPurpose}':
        Description: !Sub 'Name of the ${BucketPurpose} bucket'
        Value: !Ref
          'Fn::Sub': 'S3Bucket${BucketPurpose}'
