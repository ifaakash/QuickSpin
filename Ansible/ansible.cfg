[defaults]
# No `inventory =` default on purpose.
# Two inventories live side by side with different transports (SSM vs SSH).
# A default here means a forgotten -i silently targets the wrong fleet.
# Every run must pass -i explicitly. See README.md.
host_key_checking = False
interpreter_python = auto
deprecation_warnings = False
retry_files_enabled = False
callbacks_enabled = profile_tasks, timer

[inventory]
enable_plugins = amazon.aws.aws_ec2, yaml, ini
