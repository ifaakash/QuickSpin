[defaults]
# No `inventory =` default on purpose.
# Two inventories live side by side with different transports (SSM vs SSH).
# A default here means a forgotten -i silently targets the wrong fleet.
# Every run must pass -i explicitly. See README.md.

forks = 10
host_key_checking = False
interpreter_python = auto_silent
deprecation_warnings = False
retry_files_enabled = False
callbacks_enabled = profile_tasks, timer

[inventory]
enable_plugins = amazon.aws.aws_ec2, yaml, ini


[ssh_connection]
# To use pipelining alongside privilege escalation (become: true)
# you must ensure that Defaults requiretty is disabled in the /etc/sudoers
# file on all of your target machines
# otherwise the piped commands will be blocked by the OS
pipelining= True
