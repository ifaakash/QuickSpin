# Static inventory — hosts that are NOT provisioned by QuickSpin's Terraform.
#
# Transport is plain SSH over Tailscale. A GitHub-hosted runner is not on the
# tailnet, so this inventory ONLY works from a machine that is. Run it locally,
# never in CI. See ../README.md.
#
# Always pass this explicitly:  ansible -i inventories/static.ini homelab -m ping

[homelab]
# Raspberry Pi 5. 100.76.6.76 is a Tailscale CGNAT address (100.64.0.0/10) —
# routable only inside the tailnet.
moo ansible_host=100.76.6.76 ansible_user=ubuntu

# AWS EC2, reached over SSH rather than SSM.
#
# NOTE: ip-10-0-1-47 is the AWS private-DNS *hostname*, not an IP, and not a
# Tailscale name. It resolves via VPC-internal DNS only. If you want to reach
# this box from your laptop, replace it with the host's Tailscale IP (the node
# shows up as ip-10-0-1-47 in `tailscale status`) or its public IP.
vm ansible_host=ip-10-0-1-47 ansible_user=ubuntu

[homelab:vars]
# Neither host logs in as root. Playbooks that need privilege use `become`.
ansible_become=true
