---
# Dynamic inventory: every running EC2 tagged Project=<prefix>.
# Transport is SSM, so this works from CI without any network path to the host.
# Runs in GitHub Actions. See ../README.md.
plugin: amazon.aws.aws_ec2

regions:
  - "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"

filters:
  instance-state-name: running
  "tag:Project": "{{ lookup('env', 'QUICKSPIN_PREFIX') | default('quickspin', true) }}"

hostnames:
  - tag:Name

# Everything discovered here is an SSM-reachable cloud host.
# Playbooks target `cloud`, never `all` — `all` would also sweep in any other
# inventory passed on the same command line.
groups:
  cloud: true

compose:
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_host: instance_id
  ansible_python_interpreter: "'/usr/bin/python3'"
  ansible_aws_ssm_region: "'{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}'"
  # TODO: Create the bucket name using Terraform
  # Make an entry in the IaC/main.tf with S3 module
  # Create a module in Terraform, to accept the list of bucket names from the parent module
  # Create the bucket ( with default for quickspin-ansible-ssm-staging )
  ansible_aws_ssm_bucket_name: "'quickspin-ansible-ifaakash-us-east-1-ssm-staging'"
  quickspin_packages: tags.Packages | default('', true) | split(',') | reject('equalto', '') | list
