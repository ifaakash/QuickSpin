---
- name: Install package ( RedHat )
  ansible.builtin.yum:
    name: "{{ quickspin_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "RedHat"
  notify: Verify packages

- name: Install package ( Debian )
  ansible.builtin.apt:
    name: "{{ quickspin_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  notify: Verify packages

- name: Execute list of shell commands
  ansible.builtin.shell: "{{ item }}"
  loop: "{{ shell_commands_list }}"
  register: shell_results
  # ignore_errors: yes

- name: Display command outputs
  ansible.builtin.debug:
    msg: "Command: {{ item.item }} | Return Code: {{ item.rc }} | Output: {{ item.stdout }}"
  when: shell_results is defined and shell_results.results is defined
