---
- name: Create group for {{ jit_username }}
  ansible.builtin.group:
    name: "{{ jit_username }}"
    state: present

- name: Create lab user {{ jit_username }}
  ansible.builtin.user:
    name: "{{ jit_username }}"
    group: "{{ jit_username }}"
    groups: "{{ jit_user_groups }}"
    shell: "{{ jit_user_shell }}"
    create_home: true
    state: present

- name: Authorize SSH key for {{ jit_username }}
  ansible.posix.authorized_key:
    user: "{{ jit_username }}"
    key: "{{ jit_ssh_public_key }}"
    state: present
  when: jit_ssh_public_key | length > 0

- name: Grant passwordless sudo to {{ jit_username }}
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ jit_username }}"
    content: "{{ jit_username }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"
  when: jit_user_sudo | bool
