---
# jit_action selects which task file runs: "provision" or "revoke".
jit_action: provision

# Required: the lab user's username.
jit_username: ""

jit_user_shell: /bin/bash
jit_user_groups: []
jit_user_sudo: false
jit_ssh_public_key: ""

# revoke-only: also delete the user's home directory and mail spool.
jit_remove_home: true
