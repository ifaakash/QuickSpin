---
- name: Validate jit_action
  ansible.builtin.assert:
    that:
      - jit_action is defined
      - jit_action in ["provision", "revoke"]
    fail_msg: "jit_action must be set to either 'provision' or 'revoke'"
    success_msg: "jit_action is valid"

- name: Validate jit_username
  ansible.builtin.assert:
    that:
      - jit_username is defined
      - jit_username | length > 0
      - jit_username.startswith('jit_')
    fail_msg: "jit_username must be set and start with 'jit_'"
    success_msg: "jit_username is valid"

- name: Validate jit_publickey
  ansible.builtin.assert:
    that:
      - jit_publickey is defined
      - jit_publickey | length > 0
      - jit_publickey.startswith(('ssh-rsa', 'ssh-ed25519'))
    fail_msg: "jit_publickey must be set to a valid SSH public key starting with 'ssh-rsa' or 'ssh-ed25519'"
    success_msg: "jit_publickey is valid"
  # revoke.yml never reads the key, so demanding one made revoke impossible.
  when: jit_action == 'provision'

- name: Provision lab user
  ansible.builtin.include_tasks: provision.yml
  when: jit_action == 'provision'

- name: Revoke lab user
  ansible.builtin.include_tasks: revoke.yml
  when: jit_action == 'revoke'
