---
- name: Install packages
  # `cloud` comes from inventories/aws.aws_ec2.yml. Package names are read
  # from each instance's Packages tag, so this only makes sense for hosts
  # QuickSpin provisioned. Never `all`.
  hosts: cloud
  become: true
  gather_facts: true
  roles:
    - role: packages
      vars:
        shell_commands_list: >-
          {{
            [
              "echo 'Starting system check'",
              "uname -a",
              "uname -m"
            ] + (
              ["echo 'Install yum-config-manager if missing'", "sudo dnf install -y yum-utils"]
              if ansible_os_family == "RedHat" else []
            ) + (
              [
                "sudo mkdir -p --mode=0755 /usr/share/keyrings",
                "curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null",
                "curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list",
                "sudo apt-get update && sudo apt-get install -y tailscale"
              ] if ansible_os_family == "Debian" else []
            )
          }}
