global:
  region: "us-east-1"
  project_prefix: "quickspin"
  # Optional overrides
  # created_by: "your-name"
  # role_name: "custom-iam-role"
  # instance_profile_name: "custom-instance-profile"

networking:
  # user_ip: "49.36.144.148"
  user_ip: "49.47.70.57"
  # Optional overrides (must be valid IPv4 networks)
  # vpc_cidr: "10.0.0.0/16"
  # public_subnet_cidr: "10.0.0.0/22"
  # private_subnet_cidr: "10.0.4.0/22"

instances:
  # ami          : "" # optional — omit to use the latest official Ubuntu 22.04 LTS AMI (apt + SSM agent preinstalled)
  # instance_type: "" # possible values are t2.micro, t2.small, t2.medium, t2.large, t2.xlarge, t2.2xlarge
  # is_public    : "" # possible values are true or false

  - instance_type: "t3.micro"
    is_public: true
    # name: "my-custom-web-server" # Optional custom name
    packages:
      - nginx
